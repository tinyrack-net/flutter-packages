name: browsewell
description: Native desktop webviews with a shared, trusted automation contract.
version: 0.1.0
repository: https://github.com/tinyrack-net/flutter-packages
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.17.0
  plugin_platform_interface: ^2.1.8
  webview_all: 1.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  webview_platform_interface: 1.3.5

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: BrowsewellPlugin
      macos:
        pluginClass: BrowsewellPlugin
      windows:
        pluginClass: BrowsewellPluginCApi
