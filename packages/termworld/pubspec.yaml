name: termworld
description: >-
  A composable Flutter terminal emulator with Unicode cell rendering, VT/ANSI
  parsing, selection, keyboard and pointer input, and delta-model IME support.
version: 0.5.1
repository: https://github.com/tinyrack-net/flutter-packages
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  vtworld:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: b344d8cda523ef30b65c28b118223858a9ab11e5
      path: packages/vtworld
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  material_ui: ^1.0.0
  stream_channel: ^2.1.4
