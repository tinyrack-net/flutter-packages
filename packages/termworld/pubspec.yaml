name: termworld
description: >-
  A composable Flutter terminal emulator with Unicode cell rendering, VT/ANSI
  parsing, selection, keyboard and pointer input, and delta-model IME support.
version: 0.4.0
repository: https://github.com/tinyrack-net/flutter-packages
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  vtworld:
    git:
      url: https://github.com/tinyrack-net/dart-packages.git
      ref: 7fcd102c36eac932f37ae30d450e375018a165f5
      path: packages/vtworld
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  stream_channel: ^2.1.4
