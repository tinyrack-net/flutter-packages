name: CI

# Every job below is a required status check and none uses continue-on-error.
# A platform this repository declares is a platform this workflow proves, on a
# real runner of that operating system. Step names carry the L3/L4/L5 prefixes
# that tool/verify_platform_matrix.dart matches, so adding a platform without
# its jobs fails the build instead of passing quietly.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.4

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: Analyze the example app
        run: flutter analyze --fatal-infos
        working-directory: packages/dropwell/example
      - name: Verify the platform matrix
        run: dart run tool/verify_platform_matrix.dart

  dart:
    name: Dart (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: L1 and L2 Dart unit and widget tests
        run: flutter test packages/dropwell/test --test-randomize-ordering-seed=random

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/verify_coverage.dart dropwell

  windows:
    name: Windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 windows native unit tests
        run: dart run tool/run_native_tests.dart windows
      - name: L4 windows conformance suite
        run: flutter test integration_test -d windows
        working-directory: packages/dropwell/example
      - name: L5 windows release build
        run: flutter build windows --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart windows
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-${{ matrix.os }}-logs
          path: packages/dropwell/example/build/windows/**/*.log
          if-no-files-found: ignore

  macos:
    name: macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 macos native unit tests
        run: dart run tool/run_native_tests.dart macos
      - name: L4 macos conformance suite
        run: flutter test integration_test -d macos
        working-directory: packages/dropwell/example
      - name: L5 macos release build
        run: flutter build macos --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart macos

  linux:
    name: Linux (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install the GTK and test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtest-dev xvfb
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 linux native unit tests
        run: dart run tool/run_native_tests.dart linux
      - name: L4 linux conformance suite
        run: xvfb-run -a flutter test integration_test -d linux
        working-directory: packages/dropwell/example
      - name: L5 linux release build
        run: flutter build linux --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart linux

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: nanasess/setup-chromedriver@v2
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 web implementation unit tests
        run: flutter test test/dropwell_web_test.dart --platform chrome
        working-directory: packages/dropwell
      - name: L4 web conformance suite
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/conformance_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--enable-features=ClipboardAPI
        working-directory: packages/dropwell/example
      - name: L5 web release build
        run: flutter build web --release
        working-directory: packages/dropwell/example

  android:
    name: Android (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 24
          - 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 android native unit tests
        run: dart run tool/run_native_tests.dart android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: L4 android conformance suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: packages/dropwell/example
          script: flutter test integration_test
      - name: L5 android release build
        run: flutter build apk --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart android

  ios:
    name: iOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: Boot an iOS simulator
        # `flutter test -d <udid>` only sees a simulator that finished booting,
        # so wait on bootstatus instead of racing the device list.
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x['udid'] for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1])")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: L3 ios native unit tests
        run: dart run tool/run_native_tests.dart ios
        env:
          DROPWELL_XCODE_DESTINATION: platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}
      - name: L4 ios conformance suite
        run: flutter test integration_test -d "$SIMULATOR_UDID"
        working-directory: packages/dropwell/example
      - name: L5 ios release build
        run: flutter build ios --release --no-codesign
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart ios
