name: CI

# Every platform this repository declares is proved on a real runner of that
# operating system, and no job uses continue-on-error. A pull request scoped
# to one package runs only that package's jobs; the packages do not depend on
# each other, so the other package's evidence cannot change. Anything touching
# shared surfaces (tool/, the workflows, root configuration) and every push to
# main runs the full matrix. Step names carry the L3/L4/L5 prefixes that
# tool/verify_platform_matrix.dart matches, so adding a platform without its
# jobs fails the build instead of passing quietly.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  changes:
    name: Detect affected packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dropwell: ${{ steps.affected.outputs.dropwell }}
      termworld: ${{ steps.affected.outputs.termworld }}
    steps:
      - uses: actions/checkout@v5
      # Pinned dorny/paths-filter v4.0.3.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            dropwell:
              - 'packages/dropwell/**'
            termworld:
              - 'packages/termworld/**'
            shared:
              - '**'
              - '!packages/**'
      - name: Resolve shared changes to every package
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          DROPWELL: ${{ steps.filter.outputs.dropwell }}
          TERMWORLD: ${{ steps.filter.outputs.termworld }}
          SHARED: ${{ steps.filter.outputs.shared }}
        run: |
          affected() {
            if [[ "$EVENT" != "pull_request" || "$SHARED" == "true" || "$1" == "true" ]]; then
              echo true
            else
              echo false
            fi
          }
          {
            echo "dropwell=$(affected "$DROPWELL")"
            echo "termworld=$(affected "$TERMWORLD")"
          } >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: Analyze the example app
        run: flutter analyze --fatal-infos
        working-directory: packages/dropwell/example
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: Analyze the termworld example app
        run: flutter analyze --fatal-infos
        working-directory: packages/termworld/example
      - name: Verify the platform matrix
        run: dart run tool/verify_platform_matrix.dart
      - name: Verify the pinned xterm parity manifest
        run: dart run tool/verify_xterm_parity.dart
      - name: Verify termworld has no xterm dependency or delegation
        run: dart run tool/verify_termworld_dependencies.dart

  dart-dropwell:
    name: Dart dropwell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Dropwell L1 and L2 Dart unit and widget tests
        run: flutter test packages/dropwell/test --test-randomize-ordering-seed=random

  dart-termworld:
    name: Dart termworld (${{ matrix.os }}, shard ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
        shard:
          - 0
          - 1
          - 2
          - 3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Termworld L1 and L2 Dart unit and widget tests
        run: dart run tool/run_flutter_test_shard.dart packages/termworld ${{ matrix.shard }} 4

  coverage-dropwell:
    name: Coverage dropwell
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/verify_coverage.dart dropwell
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-coverage-dropwell
          path: packages/dropwell/coverage/lcov.info
          if-no-files-found: error

  coverage-termworld:
    name: Coverage termworld
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: dart run tool/verify_coverage.dart termworld
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dart-coverage-termworld
          path: packages/termworld/coverage/lcov.info
          if-no-files-found: error

  windows-dropwell:
    name: Windows dropwell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 windows native unit tests
        run: dart run tool/run_native_tests.dart windows
      - name: L4 windows conformance suite
        run: flutter test integration_test -d windows
        working-directory: packages/dropwell/example
      - name: L5 windows release build
        run: flutter build windows --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart windows
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-dropwell-${{ matrix.os }}-logs
          path: packages/dropwell/example/build/windows/**/*.log
          if-no-files-found: ignore

  windows-termworld:
    name: Windows termworld (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: L3 windows termworld input boundary tests
        run: |
          cmake -S packages/termworld/example/windows/test -B build/termworld-windows-tests
          cmake --build build/termworld-windows-tests --config Release
          ctest --test-dir build/termworld-windows-tests -C Release --output-on-failure
      - name: L4 windows termworld conformance suite
        run: flutter test integration_test/conformance_test.dart -d windows
        working-directory: packages/termworld/example
      - name: L5 windows termworld release build
        run: flutter build windows --release
        working-directory: packages/termworld/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart windows

  macos-dropwell:
    name: macOS dropwell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 macos native unit tests
        run: dart run tool/run_native_tests.dart macos
      - name: L4 macos conformance suite
        run: flutter test integration_test -d macos
        working-directory: packages/dropwell/example
      - name: L5 macos release build
        run: flutter build macos --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart macos

  macos-termworld:
    name: macOS termworld (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: L3 macos termworld input boundary tests
        run: |
          flutter build macos --debug --config-only
          xcodebuild test \
            -workspace macos/Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=macOS'
        working-directory: packages/termworld/example
      - name: L4 macos termworld conformance suite
        run: flutter test integration_test/conformance_test.dart -d macos
        working-directory: packages/termworld/example
      - name: L5 macos termworld release build
        run: flutter build macos --release
        working-directory: packages/termworld/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart macos

  linux-dropwell:
    name: Linux dropwell (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install the GTK and test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtest-dev xvfb
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 linux native unit tests
        run: dart run tool/run_native_tests.dart linux
      - name: L4 linux conformance suite
        run: xvfb-run -a flutter test integration_test -d linux
        working-directory: packages/dropwell/example
      - name: L5 linux release build
        run: flutter build linux --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart linux

  linux-termworld:
    name: Linux termworld (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install the GTK and test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtest-dev xvfb
      - run: flutter pub get
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: L3 linux termworld input boundary tests
        run: |
          cmake -S packages/termworld/example/linux/test -B build/termworld-linux-tests
          cmake --build build/termworld-linux-tests
          ctest --test-dir build/termworld-linux-tests --output-on-failure
      - name: L4 linux termworld conformance suite
        run: >-
          xvfb-run -a flutter test integration_test/conformance_test.dart
          -d linux
        working-directory: packages/termworld/example
      - name: L5 linux termworld release build
        run: flutter build linux --release
        working-directory: packages/termworld/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart linux

  linux-ibus:
    name: Linux IBus Hangul E2E
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install the IBus and X11 test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ibus ibus-gtk3 ibus-hangul xdotool xclip dbus-x11 xvfb scrot x11-utils x11-xserver-utils \
            clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Run the Linux IBus Hangul E2E
        env:
          GDK_BACKEND: x11
          GTK_IM_MODULE: ibus
          IBUS_USE_PORTAL: '0'
          XMODIFIERS: '@im=ibus'
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/termworld-ibus-config"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/termworld-ibus-runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" "$GITHUB_WORKSPACE/ibus-artifacts"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a dbus-run-session -- bash tool/run_linux_ibus_e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-ibus-hangul-e2e
          path: ibus-artifacts
          if-no-files-found: warn

  linux-ibus-wayland:
    name: Linux IBus Wayland E2E
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Install the IBus and Wayland test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ibus ibus-gtk3 ibus-hangul sway grim iso-codes \
            libwayland-dev libwayland-bin libxkbcommon-dev \
            clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Run the Linux IBus Wayland E2E
        env:
          GDK_BACKEND: wayland
          GTK_IM_MODULE: ibus
          IBUS_USE_PORTAL: '0'
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/termworld-ibus-wayland-config"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/termworld-ibus-wayland-runtime"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR" \
            "$GITHUB_WORKSPACE/ibus-wayland-artifacts"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash tool/run_linux_ibus_wayland_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ibus-wayland-e2e
          path: ibus-wayland-artifacts
          if-no-files-found: warn

  web-dropwell:
    name: Web dropwell
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: nanasess/setup-chromedriver@v2
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 web implementation unit tests
        run: flutter test test/dropwell_web_test.dart --platform chrome
        working-directory: packages/dropwell
      - name: L4 web conformance suite
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/conformance_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--enable-features=ClipboardAPI
        working-directory: packages/dropwell/example
      - name: L5 web release build
        run: flutter build web --release
        working-directory: packages/dropwell/example

  web-termworld:
    name: Web termworld
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: nanasess/setup-chromedriver@v2
      - run: flutter pub get
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: L3 web termworld addon tests
        run: flutter test test/termworld_web_test.dart --platform chrome
        working-directory: packages/termworld
      - name: L4 web termworld conformance suite
        run: |
          chromedriver --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/conformance_test.dart \
            -d web-server \
            --browser-name=chrome \
            --web-browser-flag=--headless=new \
            --web-browser-flag=--enable-features=ClipboardAPI
        working-directory: packages/termworld/example
      - name: L5 web termworld release build
        run: flutter build web --release
        working-directory: packages/termworld/example

  web-browsers:
    name: Web renderer (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: Install the pinned Playwright browser
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/termworld-playwright
        run: |
          npm install --prefix "$PLAYWRIGHT_ROOT" playwright@1.55.0
          "$PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install --with-deps \
            "${{ matrix.browser }}"
      - name: Build the termworld browser renderer
        run: flutter build web --release
        working-directory: packages/termworld/example
      - name: L4 web termworld browser conformance (${{ matrix.browser }})
        env:
          PLAYWRIGHT_ROOT: ${{ runner.temp }}/termworld-playwright
        run: |
          python3 -m http.server 8080 \
            --directory packages/termworld/example/build/web &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          xvfb-run -a node tool/run_termworld_browser_conformance.cjs \
            "${{ matrix.browser }}"

  android-dropwell:
    name: Android dropwell (API ${{ matrix.api-level }})
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    runs-on: ubuntu-latest
    # An emulator that never finishes booting otherwise holds the whole run
    # open for hours and keeps every other job's logs out of reach.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 24
          - 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: L3 android native unit tests
        run: dart run tool/run_native_tests.dart android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: L4 android conformance suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: packages/dropwell/example
          script: flutter test integration_test
      - name: L5 android release build
        run: flutter build apk --release
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart android

  android-termworld:
    name: Android termworld (API ${{ matrix.api-level }})
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: ubuntu-latest
    # An emulator that never finishes booting otherwise holds the whole run
    # open for hours and keeps every other job's logs out of reach.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 24
          - 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: L3 android termworld input boundary tests
        run: |
          flutter build apk --debug --config-only
          android/gradlew -p android testDebugUnitTest
        working-directory: packages/termworld/example
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: L4 android termworld conformance suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          working-directory: packages/termworld/example
          script: flutter test integration_test/conformance_test.dart
      - name: L5 android termworld release build
        run: flutter build apk --release
        working-directory: packages/termworld/example
      - name: Assert the Debug-only testing hook is absent from the release build
        run: dart run tool/verify_release_hooks.dart android

  # The two iOS pyramids used to share one job and one simulator; run them on
  # separate runners so the pipeline's wall clock is one pyramid, not both.
  ios-dropwell:
    name: iOS dropwell
    needs: changes
    if: needs.changes.outputs.dropwell == 'true'
    runs-on: macos-26
    # Simulator test processes occasionally stop producing output. Bound the
    # required job so a stuck host is reported and retried instead of holding
    # every newer parity run indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the example app
        run: flutter pub get
        working-directory: packages/dropwell/example
      - name: Boot an iOS simulator
        # `flutter test -d <udid>` only sees a simulator that finished booting,
        # so wait on bootstatus instead of racing the device list.
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x['udid'] for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1])")
          bash tool/ios_simulator_ci.sh reset "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: L3 ios native unit tests
        run: dart run tool/run_native_tests.dart ios
        env:
          DROPWELL_XCODE_DESTINATION: platform=iOS Simulator,id=${{ env.SIMULATOR_UDID }}
      - name: L4 ios conformance suite
        # Pinned nick-fields/retry v4. Retry only Flutter's unbounded simulator
        # attach wait; real build and assertion failures remain immediate.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 5
          retry_on: timeout
          command: |
            bash tool/ios_simulator_ci.sh reset "$SIMULATOR_UDID"
            cd packages/dropwell/example
            flutter test integration_test -d "$SIMULATOR_UDID"
          on_retry_command: >-
            bash tool/ios_simulator_ci.sh diagnose "$SIMULATOR_UDID"
      - name: L5 ios release build
        run: flutter build ios --release --no-codesign
        working-directory: packages/dropwell/example
      - name: Assert the Debug-only testing hook is absent from the release build
        # Only this job's release artifact exists here, so the check covers
        # exactly the dropwell example.
        run: dart run tool/verify_release_hooks.dart ios

  ios-termworld:
    name: iOS termworld
    needs: changes
    if: needs.changes.outputs.termworld == 'true'
    runs-on: macos-26
    # Simulator test processes occasionally stop producing output. Bound the
    # required job so a stuck host is reported and retried instead of holding
    # every newer parity run indefinitely.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - name: Resolve the termworld example app
        run: flutter pub get
        working-directory: packages/termworld/example
      - name: Boot an iOS simulator
        # `flutter test -d <udid>` only sees a simulator that finished booting,
        # so wait on bootstatus instead of racing the device list.
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];c=[x['udid'] for k,v in sorted(d.items()) if 'iOS' in k for x in v if x['name'].startswith('iPhone')];print(c[-1])")
          bash tool/ios_simulator_ci.sh reset "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: L3 ios termworld input boundary tests
        run: |
          flutter build ios --debug --simulator --config-only
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
        working-directory: packages/termworld/example
      - name: L4 ios termworld conformance suite
        # Pinned nick-fields/retry v4. Keep deterministic test failures visible
        # while recovering once from a stalled simulator attachment.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 5
          retry_on: timeout
          command: |
            bash tool/ios_simulator_ci.sh reset "$SIMULATOR_UDID"
            cd packages/termworld/example
            flutter test integration_test/conformance_test.dart \
              -d "$SIMULATOR_UDID"
          on_retry_command: >-
            bash tool/ios_simulator_ci.sh diagnose "$SIMULATOR_UDID"
      - name: L5 ios termworld release build
        run: flutter build ios --release --no-codesign
        working-directory: packages/termworld/example
      - name: Assert the Debug-only testing hook is absent from the release build
        # Only this job's release artifact exists here, so the check covers
        # exactly the termworld example.
        run: dart run tool/verify_release_hooks.dart ios
