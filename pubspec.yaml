name: flutter_packages_workspace
description: Tinyrack Flutter packages monorepo.
publish_to: none

environment:
  sdk: ^3.13.0

# The example app is deliberately not a workspace member. Flutter writes a
# workspace member's native_assets/ under the workspace root, while the
# generated CMake install rule looks for it under the app's own build/, so a
# member example cannot build on Windows. It resolves independently instead.
workspace:
  - packages/dropwell
  - packages/termworld

dev_dependencies:
  archive: ^4.2.0
  coverage: ^1.15.1
  path: ^1.9.1
  test: ^1.31.1
  very_good_analysis: ^11.0.0
  yaml: ^3.1.4
